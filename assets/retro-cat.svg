<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#3a2a12"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
  </defs>

  <rect width="220" height="220" rx="24" fill="url(#bgGlow)"/>

  <!-- retro sunburst rays -->
  <g opacity="0.35" stroke="#f4c430" stroke-width="3">
    <line x1="110" y1="20" x2="110" y2="0"/>
    <line x1="150" y1="30" x2="165" y2="12"/>
    <line x1="70" y1="30" x2="55" y2="12"/>
    <line x1="178" y1="60" x2="198" y2="50"/>
    <line x1="42" y1="60" x2="22" y2="50"/>
  </g>

  <!-- tail -->
  <path d="M165 150 Q205 150 200 110 Q197 90 178 95" stroke="#e8871e" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- body -->
  <ellipse cx="110" cy="165" rx="55" ry="30" fill="#e8871e"/>

  <!-- ears -->
  <polygon points="65,95 78,50 98,88" fill="#e8871e"/>
  <polygon points="155,95 142,50 122,88" fill="#e8871e"/>
  <polygon points="70,90 78,62 90,86" fill="#f4c430"/>
  <polygon points="150,90 142,62 130,86" fill="#f4c430"/>

  <!-- head -->
  <circle cx="110" cy="115" r="55" fill="#e8871e"/>

  <!-- stripes -->
  <path d="M85 65 L92 82" stroke="#c9701a" stroke-width="5" stroke-linecap="round"/>
  <path d="M135 65 L128 82" stroke="#c9701a" stroke-width="5" stroke-linecap="round"/>
  <path d="M110 60 L110 80" stroke="#c9701a" stroke-width="5" stroke-linecap="round"/>

  <!-- muzzle -->
  <ellipse cx="110" cy="130" rx="28" ry="18" fill="#fbe6c2"/>

  <!-- eyes -->
  <ellipse cx="90" cy="108" rx="10" ry="13" fill="#0d1117"/>
  <ellipse cx="130" cy="108" rx="10" ry="13" fill="#0d1117"/>
  <circle cx="93" cy="103" r="3" fill="#ffffff"/>
  <circle cx="133" cy="103" r="3" fill="#ffffff"/>

  <!-- nose -->
  <polygon points="110,122 116,130 104,130" fill="#8a4b2a"/>

  <!-- whiskers -->
  <g stroke="#fbe6c2" stroke-width="2.5" stroke-linecap="round">
    <line x1="60" y1="128" x2="30" y2="122"/>
    <line x1="60" y1="136" x2="30" y2="138"/>
    <line x1="160" y1="128" x2="190" y2="122"/>
    <line x1="160" y1="136" x2="190" y2="138"/>
  </g>

  <!-- mouth -->
  <path d="M110 130 Q104 138 96 133" stroke="#8a4b2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M110 130 Q116 138 124 133" stroke="#8a4b2a" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
